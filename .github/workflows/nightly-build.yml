name: Axum nightly build

# Two ways in:
#   1. schedule          - once a night at NB_BUILD_HOUR local, and only if the
#                          watched branch has moved since the last green build.
#   2. workflow_dispatch - manual, with an optional ref override and a force
#                          flag that ignores the already-built check.
#
# There is deliberately no push trigger. A commit landing at 3pm and a commit
# landing at 9pm produce the same nightly build, so reacting to each push just
# spends Actions minutes on work the 10pm run would do anyway.
on:
  schedule:
    # GitHub cron is UTC and has no DST, so this covers 22:00 and 23:00 local
    # in both CDT (UTC-5) and CST (UTC-6). The `gate` job keeps only the firing
    # that is actually NB_BUILD_HOUR in NB_BUILD_TZ and discards the rest.
    - cron: '0 3 * * *'   # 22:00 CDT
    - cron: '0 4 * * *'   # 23:00 CDT / 22:00 CST
    - cron: '0 5 * * *'   # 23:00 CST
  workflow_dispatch:
    inputs:
      ref:
        description: 'Firmware ref to build (default: the deployment branch)'
        required: false
        type: string
      force:
        description: 'Build even if this commit was already built successfully'
        required: false
        type: boolean
        default: false

concurrency:
  group: nightly-build
  cancel-in-progress: false

env:
  FIRMWARE_REPO:   ${{ vars.NB_FIRMWARE_REPO || 'JPI-US/Janta_Power' }}
  FIRMWARE_BRANCH: ${{ vars.NB_FIRMWARE_BRANCH || 'deployment' }}
  CHIP:            ${{ vars.NB_CHIP || 'esp32s3' }}
  TARGET:          ${{ vars.NB_RUST_TARGET || 'xtensa-esp32s3-espidf' }}
  PROFILE:         ${{ vars.NB_CARGO_PROFILE || 'release' }}
  BIN_NAME:        ${{ vars.NB_BIN_NAME || 'tower' }}
  # partitions.csv runs to exactly 0x800000, and app1/littlefs/coredump all sit
  # beyond 4MB. With no chip attached espflash can't detect flash size and falls
  # back to its default, so this has to be stated explicitly or the packaged
  # image is wrong. Note the chip itself is 32MB - the table just doesn't use it.
  FLASH_SIZE:      ${{ vars.NB_FLASH_SIZE || '8mb' }}

jobs:
  # --------------------------------------------------------------------------
  # Decides whether tonight's run does anything at all. Two independent gates:
  # the right local hour (cron is UTC and has no DST), and whether the watched
  # branch has actually moved since the last green build.
  # --------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    outputs:
      run:     ${{ steps.decide.outputs.run }}
      devices: ${{ steps.decide.outputs.devices }}
      sha:     ${{ steps.head.outputs.sha }}
    steps:
      - name: Resolve the watched branch's HEAD
        id: head
        env:
          TOKEN:  ${{ secrets.NB_FIRMWARE_TOKEN }}
          REPO:   ${{ env.FIRMWARE_REPO }}
          BRANCH: ${{ inputs.ref || env.FIRMWARE_BRANCH }}
        run: |
          # ls-remote rather than a checkout: one round trip, no clone, and
          # deciding whether to build needs nothing else from the repo.
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          sha=$(git ls-remote "$url" "$BRANCH" "refs/heads/$BRANCH" | head -1 | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::Could not resolve '$BRANCH' in $REPO. Either the branch doesn't exist or NB_FIRMWARE_TOKEN can't read the repo."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$REPO@$BRANCH is at $sha"

      # A cache entry keyed by the commit itself. A hit means every tower built
      # this exact commit and passed - the `record` job only saves the marker
      # when the whole matrix is green, so a failure leaves no marker and
      # tomorrow retries instead of skipping a broken commit forever.
      - name: Has this commit already been built?
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .nightly-marker
          key: built-${{ steps.head.outputs.sha }}
          lookup-only: true

      - id: decide
        env:
          BUILD_TZ:   ${{ vars.NB_BUILD_TZ || 'America/Chicago' }}
          BUILD_HOUR: ${{ vars.NB_BUILD_HOUR || '22' }}
          EVENT:      ${{ github.event_name }}
          FORCE:      ${{ inputs.force }}
          ALREADY:    ${{ steps.seen.outputs.cache-hit }}
          DEVICES:    ${{ vars.NB_TOWERS || '["9000","9001"]' }}
          SHA:        ${{ steps.head.outputs.sha }}
        run: |
          echo "devices=$DEVICES" >> "$GITHUB_OUTPUT"
          skip() { echo "$1"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # Three of the four scheduled firings are the wrong hour - GitHub
          # cron is UTC with no DST, so we cover every candidate and discard
          # here. Without this, "the 10pm build" silently becomes the 9pm
          # build twice a year.
          if [ "$EVENT" = "schedule" ]; then
            hour=$(TZ="$BUILD_TZ" date +%H)
            if [ "$hour" != "$BUILD_HOUR" ]; then
              skip "Local hour is $hour in $BUILD_TZ, not $BUILD_HOUR - wrong DST cron. Skipping."
            fi
            echo "$BUILD_HOUR:00 in $BUILD_TZ."
          fi

          if [ "$FORCE" = "true" ]; then
            echo "force requested - building $SHA regardless."
          elif [ "$ALREADY" = "true" ]; then
            skip "$SHA was already built successfully and the branch hasn't moved. Nothing to do."
          fi

          echo "Towers to build: $DEVICES"
          echo "run=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # One tower failing must not cancel the other's build - they're
      # independent firmware images that happen to share a commit.
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.gate.outputs.devices) }}
    # Per-tower secrets live in a GitHub Environment named tower-<id>, so
    # FIRMWARE_DOTENV / TOWER_CERT_PEM / TOWER_KEY_PEM keep identical names in
    # each and nothing below this line has to know which tower it's building.
    environment: tower-${{ matrix.device }}
    steps:
      - name: Checkout firmware (fresh pull)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FIRMWARE_REPO }}
          # The exact SHA the gate resolved, not the branch name - otherwise a
          # push landing mid-run could build 9000 and 9001 from different commits.
          ref: ${{ needs.gate.outputs.sha }}
          # github.token only works while the firmware repo is public; set the
          # NB_FIRMWARE_TOKEN secret before making it private again.
          token: ${{ secrets.NB_FIRMWARE_TOKEN || github.token }}
          path: firmware
          # Full history so the daily report can describe the day's commits,
          # not just HEAD.
          fetch-depth: 0
          submodules: recursive

      - name: Commit metadata
        id: meta
        working-directory: firmware
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "short_sha=$(git rev-parse --short HEAD)"
            echo "subject=$(git log -1 --pretty=%s)"
            echo "author=$(git log -1 --pretty=%an)"
            echo "committed_at=$(git log -1 --pretty=%cI)"
          } >> "$GITHUB_OUTPUT"
          # Commits landed since the previous nightly, for the daily report.
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          git log --since="$since" --pretty='%h %an %s' > "$RUNNER_TEMP/commits-24h.txt" || true
          echo "--- commits in the last 24h ---"
          cat "$RUNNER_TEMP/commits-24h.txt"

      # ------------------------------------------------------------------
      # Janta_Power will NOT compile from a clean checkout on its own:
      #   * build.rs bakes .env into constants.rs (gear reduction, soft limits,
      #     DEVICE_ID, Wi-Fi). Absent, it silently falls back to defaults - so
      #     you get an image that is WRONG for this tower rather than an error.
      #   * mqtt.rs include_str!s certs/tower_<DEVICE_ID>-certificate.pem.crt
      #     and -private.pem.key at COMPILE time, and certs/ is gitignored.
      # Both come from secrets, and this step fails loudly rather than shipping
      # a default-configured image.
      # ------------------------------------------------------------------
      - name: Materialize build config (.env + AWS IoT certs)
        id: config
        working-directory: firmware
        env:
          FIRMWARE_DOTENV: ${{ secrets.FIRMWARE_DOTENV }}
          TOWER_CERT_PEM:  ${{ secrets.TOWER_CERT_PEM }}
          TOWER_KEY_PEM:   ${{ secrets.TOWER_KEY_PEM }}
          MATRIX_DEVICE:   ${{ matrix.device }}
        run: |
          set -e
          if [ -z "$FIRMWARE_DOTENV" ]; then
            echo "::error::Secret FIRMWARE_DOTENV is not set. build.rs bakes .env into constants.rs; without it the image is built with DEFAULT constants (DEVICE_ID=10, GEAR_REDUCTION=1.0, the default SSID) - wrong firmware, not a build error. Refusing to build."
            exit 1
          fi
          printf '%s\n' "$FIRMWARE_DOTENV" > .env

          # Cert filenames derive from DEVICE_ID, so read it back out of .env
          # rather than keeping a second copy of it in another secret.
          device_id=$(sed -n 's/^[[:space:]]*DEVICE_ID[[:space:]]*=[[:space:]]*//p' .env | tail -1 | sed 's/[#[:space:]].*$//' | tr -d '\042\047')
          if [ -z "$device_id" ]; then
            echo "::error::DEVICE_ID missing from FIRMWARE_DOTENV - the cert filenames derive from it."
            exit 1
          fi
          # The environment and the .env inside it must agree. If they don't,
          # the constants come from one tower and the certs from another - a
          # build that succeeds and produces firmware that authenticates as the
          # wrong thing. Cheap check, expensive failure.
          if [ "$device_id" != "$MATRIX_DEVICE" ]; then
            echo "::error::Environment tower-$MATRIX_DEVICE holds a FIRMWARE_DOTENV with DEVICE_ID=$device_id. Its secrets belong to a different tower. Refusing to build."
            exit 1
          fi
          echo "Building for DEVICE_ID=$device_id"
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"

          mkdir -p certs
          # Amazon's root CA is public material - fetch it instead of storing a secret.
          curl -fsSL https://www.amazontrust.com/repository/AmazonRootCA1.pem -o certs/AmazonRootCA1.pem

          if [ -z "$TOWER_CERT_PEM" ] || [ -z "$TOWER_KEY_PEM" ]; then
            echo "::error::Secrets TOWER_CERT_PEM / TOWER_KEY_PEM are not set. mqtt.rs include_str!s certs/tower_ID-certificate.pem.crt and certs/tower_ID-private.pem.key at compile time (ID=$device_id)."
            exit 1
          fi
          printf '%s\n' "$TOWER_CERT_PEM" > "certs/tower_${device_id}-certificate.pem.crt"
          printf '%s\n' "$TOWER_KEY_PEM"  > "certs/tower_${device_id}-private.pem.key"

          # A cert and key that aren't a pair compile perfectly and then fail
          # the TLS handshake at runtime - on a pole, at night, looking like a
          # connectivity fault rather than a provisioning mistake. Comparing
          # public keys costs nothing and catches it here instead.
          cert_pub=$(openssl x509 -noout -pubkey -in "certs/tower_${device_id}-certificate.pem.crt" 2>/dev/null | openssl md5)
          key_pub=$(openssl pkey -pubout -in "certs/tower_${device_id}-private.pem.key" 2>/dev/null | openssl md5)
          if [ -z "$cert_pub" ] || [ "$cert_pub" != "$key_pub" ]; then
            echo "::error::TOWER_CERT_PEM and TOWER_KEY_PEM in environment tower-$MATRIX_DEVICE are not a matching keypair (or one of them isn't valid PEM). They would compile and then fail the AWS IoT TLS handshake at runtime."
            exit 1
          fi
          echo "cert/key pair verified"

          echo "certs present:"
          ls -1 certs

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          buildtargets: ${{ env.CHIP }}
          ldproxy: true

      - name: Install espflash
        run: cargo install espflash --locked --version "^4"

      # ------------------------------------------------------------------
      # "esp clean" + "cargo clean": a genuinely fresh build every time.
      # .embuild is where esp-idf-sys vendors and builds ESP-IDF (v5.2.2, per
      # .cargo/config.toml), so leaving it behind means the ESP-IDF half of the
      # build is NOT fresh - and that is the half that hides stale-sdkconfig
      # bugs. .env and certs/ are written above and deliberately survive.
      # ------------------------------------------------------------------
      - name: esp clean + cargo clean
        working-directory: firmware
        run: |
          set -x
          rm -rf .embuild target
          rm -rf build sdkconfig sdkconfig.old   # idf.py leftovers, if any
          cargo clean || true
          test ! -d .embuild && test ! -d target && echo "clean: ok"

      - name: cargo build
        id: build
        working-directory: firmware
        continue-on-error: true
        run: |
          set -o pipefail
          flags=""
          if [ "$PROFILE" = "release" ]; then flags="--release"; fi
          cargo build $flags --target "$TARGET" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Collect compiler diagnostics
        if: steps.build.outcome == 'failure'
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          # Trim to what an analyst actually needs: the errors and their context.
          {
            echo "### cargo build FAILED for $FIRMWARE_REPO@$SHORT_SHA"
            echo "### target=$TARGET profile=$PROFILE"
            echo
            grep -nE "^(error|thread .main. panicked)" -A 12 "$RUNNER_TEMP/build.log" | head -400 || true
            echo
            echo "### tail of build log"
            tail -120 "$RUNNER_TEMP/build.log"
          } > "$RUNNER_TEMP/build-error.txt"
          cat "$RUNNER_TEMP/build-error.txt"

      # ------------------------------------------------------------------
      # Flashable image for the installer. `save-image --merge` emits a single
      # blob containing bootloader + partition table + app, so the installer
      # writes it at offset 0x0 and needs to know nothing else.
      # ------------------------------------------------------------------
      - name: Package flashable image
        if: steps.build.outcome == 'success'
        id: package
        working-directory: firmware
        run: |
          set -e
          outdir="$RUNNER_TEMP/out"
          mkdir -p "$outdir"
          # A workspace with more than one binary would otherwise be packaged
          # arbitrarily - NB_BIN_NAME names the one that is the firmware.
          if [ -n "$BIN_NAME" ]; then
            elf="target/$TARGET/$PROFILE/$BIN_NAME"
          else
            elf=$(find "target/$TARGET/$PROFILE" -maxdepth 1 -type f -executable ! -name '*.d' ! -name '*.rlib' ! -name '*.so' | sort | head -1)
          fi
          if [ -z "$elf" ] || [ ! -f "$elf" ]; then
            echo "::error::no ELF produced under target/$TARGET/$PROFILE (BIN_NAME='$BIN_NAME')"
            ls -l "target/$TARGET/$PROFILE" || true
            exit 1
          fi
          name=$(basename "$elf")
          echo "ELF: $elf"
          cp "$elf" "$outdir/$name.elf"
          # partitions.csv is this project's partition table (declared in
          # [package.metadata.esp-idf]); without it the merged image would get
          # espflash's default layout instead of the tower's.
          # If a future esp-idf-sys drops the ESP-IDF app descriptor, add
          # --ignore-app-descriptor here rather than downgrading espflash.
          # --skip-padding keeps the merged blob at roughly the end of the app
          # (~2.2MB) instead of padding out to the full 8MB of mostly 0xFF.
          # Inter-segment gaps are still padded, so offsets stay correct and it
          # is still written at 0x0.
          espflash save-image --chip "$CHIP" --flash-size "$FLASH_SIZE" \
            --partition-table partitions.csv --merge --skip-padding \
            "$elf" "$outdir/$name-merged.bin"
          espflash save-image --chip "$CHIP" --flash-size "$FLASH_SIZE" \
            --partition-table partitions.csv "$elf" "$outdir/$name-app.bin"
          ( cd "$outdir" && sha256sum ./* > SHA256SUMS )
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l "$outdir"

      - name: Write manifest
        if: always()
        env:
          VERDICT:    ${{ steps.build.outcome == 'success' && 'PASS' || 'FAIL' }}
          IMAGE_NAME: ${{ steps.package.outputs.name }}
          REF:        ${{ inputs.ref || env.FIRMWARE_BRANCH }}
          SHA:        ${{ steps.meta.outputs.sha }}
          SHORT_SHA:  ${{ steps.meta.outputs.short_sha }}
          SUBJECT:    ${{ steps.meta.outputs.subject }}
          AUTHOR:     ${{ steps.meta.outputs.author }}
          COMMITTED:  ${{ steps.meta.outputs.committed_at }}
          TRIGGER:    ${{ github.event_name }}
          RUN_URL:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID:     ${{ github.run_id }}
          DEVICE_ID:  ${{ steps.config.outputs.device_id }}
        run: |
          outdir="$RUNNER_TEMP/out"
          mkdir -p "$outdir"
          merged="$outdir/$IMAGE_NAME-merged.bin"
          if [ -f "$merged" ]; then
            image_sha=$(sha256sum "$merged" | cut -d' ' -f1)
            image="$IMAGE_NAME-merged.bin"
          else
            image_sha=""
            image=""
          fi
          # Build the JSON with python so a commit subject containing quotes,
          # backslashes or unicode can't produce a malformed manifest.
          IMAGE="$image" IMAGE_SHA="$image_sha" BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          python3 - "$outdir/manifest.json" <<'PY'
          import json, os, sys
          manifest = {
              "verdict":        os.environ["VERDICT"],
              "repo":           os.environ.get("FIRMWARE_REPO", ""),
              "ref":            os.environ.get("REF", ""),
              "commit":         os.environ.get("SHA", ""),
              "short_commit":   os.environ.get("SHORT_SHA", ""),
              "commit_subject": os.environ.get("SUBJECT", ""),
              "commit_author":  os.environ.get("AUTHOR", ""),
              "committed_at":   os.environ.get("COMMITTED", ""),
              "chip":           os.environ.get("CHIP", ""),
              "target":         os.environ.get("TARGET", ""),
              "profile":        os.environ.get("PROFILE", ""),
              "trigger":        os.environ.get("TRIGGER", ""),
              "run_id":         os.environ.get("RUN_ID", ""),
              "run_url":        os.environ.get("RUN_URL", ""),
              "built_at":       os.environ["BUILT_AT"],
              "image":          os.environ["IMAGE"],
              "image_sha256":   os.environ["IMAGE_SHA"],
              "flash_offset":   "0x0",
              # The installer needs both: write at 0x0, and the chip must be
              # configured for this flash size or the partition table won't fit.
              "flash_size":     os.environ.get("FLASH_SIZE", ""),
              "partition_table": "partitions.csv",
              # The image embeds THIS tower's certs and .env constants - it is
              # not interchangeable across the fleet.
              "device_id":      os.environ.get("DEVICE_ID", ""),
          }
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          PY
          cp "$RUNNER_TEMP/build.log"        "$outdir/build.log"        2>/dev/null || true
          cp "$RUNNER_TEMP/build-error.txt"  "$outdir/build-error.txt"  2>/dev/null || true
          cp "$RUNNER_TEMP/commits-24h.txt"  "$outdir/commits-24h.txt"  2>/dev/null || true
          cat "$outdir/manifest.json"

      # WARNING: the merged image embeds this tower's AWS IoT private key.
      # Artifacts of a PUBLIC repo are downloadable by anyone who can see it.
      # Keep JPI-US/nightly-built private, or do not inject real certs.
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The agent matches on the -<device> suffix to pick its own tower's
          # image; it refuses to fall back to another, so this name matters.
          name: axum-build-${{ steps.meta.outputs.short_sha }}-${{ matrix.device }}
          path: ${{ runner.temp }}/out
          retention-days: 30
          if-no-files-found: warn

      # Opt-in, and off by default for the same reason as above: a rolling
      # `nightly` release would publish a firmware image containing device
      # credentials to an unauthenticated URL.
      - name: Publish rolling nightly release
        if: steps.build.outcome == 'success' && vars.NB_PUBLISH_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Axum nightly (${{ steps.meta.outputs.short_sha }})
          prerelease: true
          files: ${{ runner.temp }}/out/*

      - name: Result
        id: result
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          DEVICE: ${{ matrix.device }}
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
            echo "### PASS - tower $DEVICE @ $SHORT_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "verdict=FAIL" >> "$GITHUB_OUTPUT"
            echo "### FAIL - tower $DEVICE @ $SHORT_SHA" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -60 "$RUNNER_TEMP/build-error.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # --------------------------------------------------------------------------
  # Remember this commit as built - but only if the WHOLE matrix passed. A
  # partial failure leaves no marker, so tonight's failure is retried tomorrow
  # rather than skipped forever as "already built".
  # --------------------------------------------------------------------------
  record:
    needs: [gate, build]
    if: needs.gate.outputs.run == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "commit: ${{ needs.gate.outputs.sha }}"
            echo "towers: ${{ needs.gate.outputs.devices }}"
            echo "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > .nightly-marker
          cat .nightly-marker
      - uses: actions/cache/save@v4
        with:
          path: .nightly-marker
          key: built-${{ needs.gate.outputs.sha }}
